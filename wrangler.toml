name = "sevent-english"
compatibility_date = "2026-08-09"
main = "worker/src/index.ts"

assets = { directory = "./dist", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }

[[d1_databases]]
# 生产 D1 数据库（已创建：sevent-english-db，APAC 区）
# 本地 dev 时 wrangler 会基于 database_name 在 .wrangler/state 下维护本地 sqlite。
binding = "DB"
database_name = "sevent-english-db"
database_id = "2697f2d4-1f5a-4266-a02c-bd2c894253a8"

[[r2_buckets]]
# 本地 dev 使用 Miniflare 本地对象存储（.wrangler/state），无需占用真实 R2。
# 部署前改为真实 bucket_name。
binding = "BUCKET"
bucket_name = "sevent-english-assets"

# AI 文章分析队列：analyze 请求只做「设 processing + 入队」，由队列 consumer 执行 AI 调用。
# worker 的 waitUntil 任务在响应返回后最多只能再跑 30 秒（Cloudflare 平台限制），
# 而 AI 生成完整分析需数分钟，因此长任务必须走队列（consumer wall time 15 分钟）。
[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "article-analysis"

[[queues.consumers]]
queue = "article-analysis"
max_batch_size = 1
max_retries = 3
